<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LTD Grove Street – Registre Fertilisants</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #0c0a18;
      --s1:      #13102a;
      --s2:      #1a1638;
      --s3:      #201c42;
      --border:  rgba(139,92,246,.15);
      --border2: rgba(139,92,246,.25);
      --pur:     #8b5cf6;
      --pur2:    #a78bfa;
      --pur3:    rgba(139,92,246,.1);
      --grn:     #34d399;
      --grn2:    #6ee7b7;
      --grn3:    rgba(52,211,153,.1);
      --red:     #f87171;
      --red3:    rgba(248,113,113,.1);
      --warn:    #fbbf24;
      --text:    #ede9fe;
      --sub:     #a29bc4;
      --muted:   #5e5880;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* soft glow bg */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(139,92,246,.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 35% at 80% 85%, rgba(52,211,153,.08) 0%, transparent 55%);
      pointer-events: none;
    }

    .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 28px 28px 80px; }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-icon {
      width: 46px; height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--pur) 0%, var(--grn) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.01em;
    }
    .brand-sub {
      font-size: .75rem;
      font-weight: 400;
      color: var(--sub);
      margin-top: 2px;
    }

    .header-right {
      display: flex; align-items: center; gap: 20px;
    }
    .hpill {
      display: flex; align-items: center; gap: 10px;
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 8px 18px;
    }
    .hpill-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--grn);
      box-shadow: 0 0 8px var(--grn);
      animation: blink 2.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .hpill-txt {
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      color: var(--text);
    }

    .hcard {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 20px;
      text-align: center;
    }
    .hcard-val {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--grn);
    }
    .hcard-lbl {
      font-size: .65rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ── LAYOUT ── */
    .cols {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }

    /* ── CARD ── */
    .card {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
    }
    .card-head {
      display: flex; align-items: center; gap: 10px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
    }
    .card-icon {
      width: 32px; height: 32px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem;
      flex-shrink: 0;
    }
    .card-icon.pur { background: var(--pur3); }
    .card-icon.grn { background: var(--grn3); }
    .card-title {
      font-size: .85rem;
      font-weight: 600;
      color: var(--text);
    }
    .card-body { padding: 24px; }

    /* ── FORM ── */
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--sub);
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 12px 16px;
      background: var(--s2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: .95rem;
      font-weight: 400;
      transition: border-color .2s, background .2s, box-shadow .2s;
      -webkit-appearance: none;
    }
    .field input:focus {
      outline: none;
      border-color: var(--pur);
      background: var(--s3);
      box-shadow: 0 0 0 4px rgba(139,92,246,.12);
    }
    .field input::placeholder { color: var(--muted); }

    .sect-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0 16px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .sect-divider::before, .sect-divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }

    /* quota */
    .quota-wrap {
      background: var(--s2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: none;
    }
    .quota-wrap.active { display: block; }
    .quota-wrap.over { border-color: rgba(248,113,113,.35); background: var(--red3); }
    .quota-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .quota-label {
      font-size: .78rem;
      font-weight: 500;
      color: var(--sub);
    }
    .quota-label.over { color: var(--red); }
    .quota-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      color: var(--pur2);
    }
    .quota-num.over { color: var(--red); }
    .quota-track {
      height: 6px;
      background: var(--s3);
      border-radius: 100px;
      overflow: hidden;
    }
    .quota-fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, var(--pur), var(--grn));
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }
    .quota-fill.warn { background: linear-gradient(90deg, var(--warn), #f97316); }
    .quota-fill.over { background: var(--red); }

    .btn-sub {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--pur) 0%, #6d28d9 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(139,92,246,.3);
    }
    .btn-sub:hover:not(:disabled) { opacity: .9; box-shadow: 0 6px 28px rgba(139,92,246,.45); }
    .btn-sub:active:not(:disabled) { transform: scale(.98); }
    .btn-sub:disabled { background: var(--s2); color: var(--muted); cursor: not-allowed; box-shadow: none; border: 1.5px solid var(--border); }

    /* ── STATS ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .scard {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 14px;
    }
    .sval {
      font-size: 2rem;
      font-weight: 700;
      color: var(--grn);
      line-height: 1;
    }
    .slbl {
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    /* top list */
    .trow {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .trow:last-child { border-bottom: none; }
    .tname { font-size: .88rem; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ttrack { width: 72px; height: 5px; background: var(--s3); border-radius: 100px; overflow: hidden; flex-shrink: 0; }
    .tfill  { height: 100%; border-radius: 100px; }
    .tcount { font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--sub); flex-shrink: 0; min-width: 36px; text-align: right; }

    /* ── TABLE ── */
    .tbl-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    #search {
      padding: 9px 16px;
      background: var(--s2);
      border: 1.5px solid var(--border);
      border-radius: 100px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: .85rem;
      width: 260px;
      transition: border-color .2s, box-shadow .2s;
    }
    #search:focus { outline: none; border-color: var(--pur); box-shadow: 0 0 0 4px rgba(139,92,246,.1); }
    #search::placeholder { color: var(--muted); }
    .rec-n { font-size: .8rem; color: var(--sub); }
    .rec-n b { color: var(--pur2); font-weight: 600; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    col.c1,col.c2 { width:13%; }
    col.c3 { width:11%; }
    col.c4 { width:13%; }
    col.c5 { width:9%; }
    col.c6 { width:15%; }
    col.c7 { width:8%; }

    thead tr { border-bottom: 1px solid var(--border); }
    th {
      padding: 12px 16px;
      font-size: .68rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); text-align: left;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
    tbody tr:hover { background: rgba(139,92,246,.05); }
    td { padding: 13px 16px; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.mono { font-family: 'JetBrains Mono', monospace; font-size: .78rem; color: var(--sub); }
    td.seller { color: var(--pur2); font-weight: 500; font-size: .85rem; }

    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 3px 12px;
      border-radius: 100px;
      font-size: .78rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    .b-lo  { background: var(--grn3);  color: var(--grn2); }
    .b-mid { background: rgba(251,191,36,.1); color: var(--warn); }
    .b-hi  { background: var(--red3);  color: var(--red); }

    .btn-del {
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: .95rem; padding: 5px 9px;
      border-radius: 8px;
      transition: all .15s;
    }
    .btn-del:hover { color: var(--red); background: var(--red3); }

    #empty {
      text-align: center; padding: 60px 24px;
      font-size: .88rem; color: var(--muted);
    }

    /* ── MODAL ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(8,6,20,.85);
      backdrop-filter: blur(8px);
      z-index: 500;
      align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--s1);
      border: 1px solid var(--border2);
      border-radius: 24px;
      padding: 36px 32px;
      width: 90%; max-width: 380px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,.6);
    }
    .modal-ico { font-size: 2rem; margin-bottom: 14px; }
    .modal h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 10px; }
    .modal p  { font-size: .88rem; color: var(--sub); line-height: 1.7; margin-bottom: 28px; }
    .modal-btns { display: flex; gap: 12px; }
    .modal-btns button { flex: 1; padding: 13px; border-radius: 12px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: .92rem; cursor: pointer; border: none; transition: opacity .15s, transform .1s; }
    .modal-btns button:hover { opacity: .88; }
    .modal-btns button:active { transform: scale(.98); }
    .m-cancel { background: var(--s3); color: var(--sub); border: 1px solid var(--border2) !important; }
    .m-del { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; box-shadow: 0 4px 16px rgba(239,68,68,.3); }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      padding: 12px 24px;
      border-radius: 100px;
      font-size: .82rem;
      font-weight: 500;
      pointer-events: none; opacity: 0;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .25s;
      z-index: 999;
      white-space: nowrap;
      border: 1px solid;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.ok  { background: var(--s1); color: var(--grn2);  border-color: rgba(52,211,153,.3);  box-shadow: 0 8px 30px rgba(52,211,153,.15); }
    #toast.err { background: var(--s1); color: var(--red);   border-color: rgba(248,113,113,.3); box-shadow: 0 8px 30px rgba(248,113,113,.15); }
    #toast.wrn { background: var(--s1); color: var(--warn);  border-color: rgba(251,191,36,.3);  box-shadow: 0 8px 30px rgba(251,191,36,.12); }

    /* spinner */
    .spin {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: sp .5s linear infinite;
      display: inline-block; vertical-align: middle; margin-right: 8px;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">🌿</div>
      <div>
        <div class="brand-title">LTD Grove Street</div>
        <div class="brand-sub">Registre contrôle fertilisants</div>
      </div>
    </div>
    <div class="header-right">
      <div class="hcard">
        <div class="hcard-val" id="hd-total">—</div>
        <div class="hcard-lbl">Vendus auj.</div>
      </div>
      <div class="hcard">
        <div class="hcard-val" id="hd-buyers">—</div>
        <div class="hcard-lbl">Acheteurs</div>
      </div>
      <div class="hpill">
        <div class="hpill-dot"></div>
        <div class="hpill-txt" id="clock">--:--:--</div>
      </div>
    </div>
  </header>

  <div class="cols">

    <!-- FORMULAIRE -->
    <div>
      <div class="card">
        <div class="card-head">
          <div class="card-icon pur">📋</div>
          <span class="card-title">Nouvel enregistrement</span>
        </div>
        <div class="card-body">
          <div class="field"><label>Prénom acheteur</label><input id="prenom" type="text" placeholder="Jean" autocomplete="off"/></div>
          <div class="field"><label>Nom acheteur</label><input id="nom" type="text" placeholder="Dupont" autocomplete="off"/></div>
          <div class="field"><label>Quantité (max 15 / 10 min)</label><input id="qte" type="number" min="1" max="15" placeholder="1 – 15"/></div>

          <div class="quota-wrap" id="quota-wrap">
            <div class="quota-top">
              <span class="quota-label" id="quota-lbl">0 / 15 utilisés aujourd'hui</span>
              <span class="quota-num" id="quota-num">0%</span>
            </div>
            <div class="quota-track"><div class="quota-fill" id="quota-fill" style="width:0%"></div></div>
          </div>

          <div class="sect-divider">Vendeur</div>

          <div class="field"><label>Prénom vendeur</label><input id="v-prenom" type="text" placeholder="Marc" autocomplete="off"/></div>
          <div class="field"><label>Nom vendeur</label><input id="v-nom" type="text" placeholder="Martin" autocomplete="off"/></div>

          <button class="btn-sub" id="submit-btn" onclick="submitAchat()">Enregistrer l'achat</button>
        </div>
      </div>
    </div>

    <!-- STATS -->
    <div>
      <div class="card" style="height:100%">
        <div class="card-head">
          <div class="card-icon grn">📊</div>
          <span class="card-title">Statistiques du jour</span>
        </div>
        <div class="card-body">
          <div class="stats-row">
            <div class="scard"><div class="sval" id="st-total">0</div><div class="slbl">Vendus</div></div>
            <div class="scard"><div class="sval" id="st-buyers">0</div><div class="slbl">Acheteurs</div></div>
            <div class="scard"><div class="sval" id="st-max">0</div><div class="slbl">Max / pers.</div></div>
          </div>
          <div id="top-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORIQUE -->
  <div class="card">
    <div class="card-head">
      <div class="card-icon pur">🕐</div>
      <span class="card-title">Historique complet</span>
    </div>
    <div class="tbl-top">
      <input id="search" type="text" placeholder="🔍  Rechercher nom, prénom, vendeur…" oninput="renderTable()"/>
      <div class="rec-n"><b id="rec-n">0</b> entrée(s)</div>
    </div>
    <div id="tbl-wrap"><div id="empty">Chargement…</div></div>
  </div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-ico">🗑️</div>
    <h3>Supprimer cette entrée ?</h3>
    <p id="modal-txt"></p>
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal()">Annuler</button>
      <button class="m-del" onclick="confirmDel()">Supprimer</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyBLlfJmzviSHoQDik6tNuf5lNCNbfisrdM",
    authDomain:        "ltd-fertilisant.firebaseapp.com",
    databaseURL:       "https://ltd-fertilisant-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "ltd-fertilisant",
    storageBucket:     "ltd-fertilisant.firebasestorage.app",
    messagingSenderId: "547998924847",
    appId:             "1:547998924847:web:f239708a5c138fe13e06da"
  };

  firebase.initializeApp(firebaseConfig);
  const db  = firebase.database();
  const ref = db.ref("achats");
  let all = [];

  setInterval(() => {
    document.getElementById("clock").textContent = new Date().toLocaleTimeString("fr-FR");
  }, 1000);
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("fr-FR");

  function todayStr() { return new Date().toISOString().split("T")[0]; }

  const $p  = document.getElementById("prenom");
  const $n  = document.getElementById("nom");
  const $q  = document.getElementById("qte");
  const $vp = document.getElementById("v-prenom");
  const $vn = document.getElementById("v-nom");

  function getUsed(p, n) {
    const since = Date.now() - 10 * 60 * 1000; // 10 minutes glissantes
    return all.filter(a => a.prenom.toLowerCase()===p && a.nom.toLowerCase()===n && a.timestamp >= since).reduce((s,a)=>s+a.qte,0);
  }

  function updateQuota() {
    const p = $p.value.trim().toLowerCase();
    const n = $n.value.trim().toLowerCase();
    const wrap = document.getElementById("quota-wrap");
    if (!p || !n) { wrap.classList.remove("active"); return; }

    const u   = getUsed(p, n);
    const pct = Math.min((u/15)*100, 100);
    const fill = document.getElementById("quota-fill");
    const lbl  = document.getElementById("quota-lbl");
    const num  = document.getElementById("quota-num");

    wrap.classList.add("active");
    wrap.classList.toggle("over", u >= 15);
    fill.style.width = pct + "%";
    fill.className = "quota-fill" + (pct>=100?" over":pct>=60?" warn":"");
    lbl.className  = "quota-label" + (u>=15?" over":"");
    num.className  = "quota-num"   + (u>=15?" over":"");
    lbl.textContent = u>=15 ? "⛔ Quota atteint — 15/15" : `${u} / 15 sur les 10 dernières minutes — reste ${15-u}`;
    num.textContent = Math.round(pct) + "%";

    const qv = parseInt($q.value)||0;
    document.getElementById("submit-btn").disabled = u>=15 || (qv>0 && u+qv>15) || qv<1;
  }

  [$p,$n,$q].forEach(el=>el.addEventListener("input",updateQuota));

  // Rafraîchit le quota automatiquement (la fenêtre de 10 min s'écoule sans action)
  setInterval(updateQuota, 15000);

  async function submitAchat() {
    const prenom=($p.value||"").trim(), nom=($n.value||"").trim();
    const qte=parseInt($q.value), vprenom=($vp.value||"").trim(), vnom=($vn.value||"").trim();

    if (!prenom||!nom||!qte) { toast("Prénom, nom et quantité requis","wrn"); return; }
    if (!vprenom||!vnom)     { toast("Indiquez le vendeur","wrn"); return; }
    if (qte<1||qte>15)       { toast("Quantité invalide (1–15)","wrn"); return; }

    const u = getUsed(prenom.toLowerCase(), nom.toLowerCase());
    if (u+qte>15) { toast(`Quota dépassé — ${prenom} ${nom} : ${u} déjà enregistré(s)`, "err"); return; }

    const btn = document.getElementById("submit-btn");
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>Enregistrement…';

    try {
      await ref.push({ prenom:cap(prenom), nom:cap(nom), qte, vendeur:cap(vprenom)+" "+cap(vnom), date:todayStr(), timestamp:Date.now() });
      toast(`✓ ${cap(prenom)} ${cap(nom)} · ${qte} fert. · via ${cap(vprenom)} ${cap(vnom)}`,"ok");
      $p.value=""; $n.value=""; $q.value="";
      updateQuota();
    } catch(e) { toast("Erreur : "+e.message,"err"); }
    finally { btn.disabled=false; btn.textContent="Enregistrer l'achat"; }
  }

  ref.on("value", snap => {
    const raw = snap.val()||{};
    all = Object.entries(raw).map(([id,v])=>({id,...v}));
    all.sort((a,b)=>b.timestamp-a.timestamp);
    renderTable(); renderStats(); updateQuota();
  });

  function renderTable() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const list = q ? all.filter(a=>
      a.prenom.toLowerCase().includes(q)||a.nom.toLowerCase().includes(q)||
      (a.vendeur||"").toLowerCase().includes(q)||a.date.includes(q)) : all;

    document.getElementById("rec-n").textContent = list.length;
    const wrap = document.getElementById("tbl-wrap");
    if (!list.length) { wrap.innerHTML=`<div id="empty">${q?"Aucun résultat.":"Aucune entrée pour le moment."}</div>`; return; }

    const rows = list.map((a,i)=>{
      const heure = new Date(a.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      const cls = a.qte<=5?"b-lo":a.qte<=10?"b-mid":"b-hi";
      return `<tr>
        <td>${a.prenom}</td><td>${a.nom}</td>
        <td class="mono">${fmtD(a.date)}</td>
        <td class="mono">${heure}</td>
        <td><span class="badge ${cls}">${a.qte}</span></td>
        <td class="seller">${a.vendeur||"—"}</td>
        <td><button class="btn-del" onclick="askDel('${a.id}','${a.prenom} ${a.nom}','${fmtD(a.date)}',${a.qte},'${a.vendeur||"—"}')">✕</button></td>
      </tr>`;
    }).join("");

    wrap.innerHTML=`<table>
      <colgroup><col class="c1"/><col class="c2"/><col class="c3"/><col class="c4"/><col class="c5"/><col class="c6"/><col class="c7"/></colgroup>
      <thead><tr><th>Prénom</th><th>Nom</th><th>Date</th><th>Heure</th><th>Qté</th><th>Vendeur</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  function renderStats() {
    const d=todayStr(), td=all.filter(a=>a.date===d);
    const tot=td.reduce((s,a)=>s+a.qte,0);
    const byP={};
    td.forEach(a=>{ const k=a.prenom+" "+a.nom; byP[k]=(byP[k]||0)+a.qte; });
    const nb=Object.keys(byP).length, mx=nb?Math.max(...Object.values(byP)):0;

    document.getElementById("st-total").textContent=tot;
    document.getElementById("st-buyers").textContent=nb;
    document.getElementById("st-max").textContent=mx;
    document.getElementById("hd-total").textContent=tot;
    document.getElementById("hd-buyers").textContent=nb;

    const sorted=Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,6);
    document.getElementById("top-list").innerHTML=sorted.map(([nom,n])=>{
      const col=n>=15?"var(--red)":n>=10?"var(--warn)":"var(--grn)";
      return `<div class="trow">
        <span class="tname">${nom}</span>
        <div class="ttrack"><div class="tfill" style="width:${n/15*100}%;background:${col}"></div></div>
        <span class="tcount">${n}/15</span>
      </div>`;
    }).join("")||`<p style="font-size:.82rem;color:var(--muted);padding:12px 0">Aucun achat aujourd'hui.</p>`;
  }

  let delId=null;
  function askDel(id,nom,date,qte,vend) {
    delId=id;
    document.getElementById("modal-txt").innerHTML=`<strong>${nom}</strong><br>${date} — ${qte} fertilisant(s)<br>Vendeur : ${vend}`;
    document.getElementById("overlay").classList.add("open");
  }
  function closeModal() { delId=null; document.getElementById("overlay").classList.remove("open"); }
  async function confirmDel() {
    if (!delId) return;
    try { await db.ref("achats/"+delId).remove(); toast("Entrée supprimée","ok"); }
    catch(e) { toast("Erreur : "+e.message,"err"); }
    closeModal();
  }
  document.getElementById("overlay").addEventListener("click",e=>{ if(e.target===e.currentTarget) closeModal(); });

  function cap(s) { return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }
  function fmtD(d) { if(!d) return ""; const [y,m,j]=d.split("-"); return `${j}/${m}/${y}`; }

  let tTimer;
  function toast(msg, type="ok") {
    const t=document.getElementById("toast");
    t.textContent=msg; t.className=`show ${type}`;
    clearTimeout(tTimer); tTimer=setTimeout(()=>{t.className="";},3200);
  }
</script>
</body>
</html>
